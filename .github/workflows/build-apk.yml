# Gera o APK de teste (debug) na nuvem do GitHub — não precisa instalar Android SDK no PC.
#
# Como usar:
#  - Roda sozinho a cada push na branch "feature/firebase-crud-apk"; ou
#  - Aba Actions > "Gerar APK" > Run workflow (só aparece depois que este arquivo estiver na branch main).
#  Ao terminar, baixe o arquivo "fect-apk" na seção Artifacts (contém o app-debug.apk).
#
# As chaves abaixo são a configuração do app WEB do Firebase. Elas não são segredo: ficam
# visíveis dentro de qualquer app que use o Firebase. Quem protege os dados são as regras
# do Firestore (firestore.rules).
name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [feature/firebase-crud-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDi1kalXBrftAlaQ0GXB9KLrComQHjgRog
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: fect-feira-ciencias.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: fect-feira-ciencias
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: fect-feira-ciencias.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "745660393372"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:745660393372:web:955b53276d3264b2c1ca59
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O Capacitor 8 exige JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # O runner do GitHub já traz o Android SDK; só garantimos licenças e a plataforma 36.
      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      # Build do site (pasta out/) e cópia para o projeto Android.
      - run: npm run android:sync

      # Compila o APK.
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: fect-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
